<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadgeta Store - Kasir & Stok</title>
    
    <!-- Tailwind & Lucide Icons -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script src="[https://unpkg.com/lucide@latest](https://unpkg.com/lucide@latest)"></script>

    <!-- Memanggil CSS Eksternal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- Notifikasi Toast -->
    <div id="toast" class="fixed top-4 right-4 flex items-center p-4 text-sm rounded-xl shadow-lg z-50 bg-green-50 text-green-800 border border-green-200">
        <i data-lucide="check-circle-2" class="w-5 h-5 mr-2" id="toast-icon"></i>
        <span id="toast-message" class="font-medium">Pesan sukses!</span>
    </div>

    <!-- Kontainer Aplikasi Utama -->
    <div class="no-print min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <!-- (Isi Navigasi Sama Seperti Sebelumnya) -->
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 flex items-center space-x-3">
                            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                <i data-lucide="smartphone" class="w-6 h-6"></i>
                            </div>
                            <div class="leading-tight">
                                <span class="font-extrabold text-xl tracking-tight text-slate-900 block">GadgeTa <span class="text-indigo-600">Store</span></span>
                            </div>
                        </div>
                        <div class="hidden md:ml-10 md:flex md:space-x-2">
                            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 bg-slate-100 text-slate-900">
                                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                                <span>Ringkasan</span>
                            </button>
                            <button onclick="switchTab('inventory')" id="nav-inventory" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 text-slate-500 hover:text-slate-900 hover:bg-slate-50">
                                <i data-lucide="package" class="w-4 h-4"></i>
                                <span>Stok & IMEI</span>
                            </button>
                            <button onclick="switchTab('sales')" id="nav-sales" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 text-slate-500 hover:text-slate-900 hover:bg-slate-50">
                                <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                                <span>Kasir</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- VIEW: DASHBOARD (Isi HTML persis seperti sebelumnya) -->
            <!-- VIEW: INVENTORY (Isi HTML persis seperti sebelumnya) -->
            <!-- VIEW: SALES / KASIR (Isi HTML persis seperti sebelumnya) -->
            <!-- (Agar tidak terlalu panjang, letakkan block kode HTML main content Anda sebelumnya di sini) -->
        </main>
    </div>

    <!-- AREA CETAK FAKTUR / PRINT INVOICE -->
    <div id="print-area" class="hidden print:flex print:flex-col bg-white text-black font-sans text-sm w-full max-w-4xl mx-auto p-4 border border-black min-h-[500px]">
        <!-- (Isi HTML Faktur Print persis seperti sebelumnya) -->
    </div>

    <!-- Memanggil JS Eksternal -->
    <!-- PENTING: data.js harus dipanggil sebelum app.js -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
